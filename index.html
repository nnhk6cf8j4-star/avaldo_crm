    ${fee && spent > reimb ? `<p class="muted" style="font-size:13px">Sof foyda = usta puli ${fmt(fee)} − o‘zingizdan ketgan ${fmt(spent - reimb)} (qaytarilmaydigan xarajat va ishchilar haqi)</p>` : ''}
    ${spends.length || workV ? `<div class="rows">${spends.map((t) => txRow(t)).join('')}${workRows}</div>` : '<p class="muted">Yo‘l, Labo, mayda material yoki yordamchi uchun o‘z hisobingizdan pul sarflasangiz, shu yerdan yozing — kassadan chiqim bo‘ladi va ish beruvchining qarziga qo‘shiladi (u qaytaradi). Qaytarilmaydigan xarajatni «o‘zimdan» deb belgilang.</p>'}</div>`;
  const note = j.note ? `<div class="block"><h4>${icon('edit', 'sm')}Tafsilotlar</h4><div class="note">${esc(j.note)}</div></div>` : '';
  const hist = (j.history || []).length ? `<div class="block"><details class="steps"><summary>Tarix · ${j.history.length} ta yozuv</summary><div class="hist" style="margin-top:12px">${j.history.slice().reverse().map((h) => `<div>${esc(h.t)}<small>${dmy(h.at)} ${hhmm(h.at)}${h.by ? ' · ' + who(h.by) : ''}</small></div>`).join('')}</div></details></div>` : '';
  const canDel = !pays.length && !spends.length && !works.length && !Store.data.tx.some((t) => t.jobId === id);
  const foot = `<div class="left"><button class="btn" data-act="copyJob" data-id="${id}">${icon('copy', 'sm')}Matnni nusxalash</button></div>
    <button class="btn" data-act="editJob" data-id="${id}" data-w>${icon('edit', 'sm')}Tahrirlash</button>
    ${jActive(j) ? `<button class="btn danger" data-act="jobCancel" data-id="${id}" data-w>Bekor qilish</button>` : ''}
    ${canDel ? `<button class="btn danger icon" data-act="deleteJob" data-id="${id}" data-w aria-label="O‘chirish">${icon('trash', 'sm')}</button>` : ''}`;
  return { title: `Hamkorlik ${jNo(j)}`, sub: `${stagePill(j.stage)} <span style="margin-left:6px">${esc(p.name)} · ${items.length > 1 ? items.length + ' ta buyum' : esc(items[0].type)}</span>`, body: track + info + itemsBlock + money + costs + note + hist, foot };
}

function partnerForm(p) {

    title: isNew ? 'Yangi ish beruvchi' : 'Ish beruvchini tahrirlash', sub: 'Korxona, do‘kon yoki usta',

    async onSubmit(f) {

A.newPartner = () => { if (needWrite()) partnerForm(null); };
A.editPartner = (d) => { const p = M.partner.get(d.id); if (p && needWrite()) partnerForm(p); };
A.deletePartner = async (d) => {
  const p = M.partner.get(d.id); if (!p || !needWrite()) return;
  if (partnerJobs(p.id).length) return toast('Bu ish beruvchida ishlar bor', true);
  if (!(await confirmBox({ title: `«${esc(p.name)}» o‘chirilsinmi?`, ok: 'O‘chirish', danger: true }))) return;

};

    <div class="full fgrid" id="newPartnerBox" hidden style="padding:14px;border-radius:14px;background:var(--surface-2)">

      ${field('Telefon', textInp('np_phone', '', '+998 90 123 45 67', 'inputmode="tel"'))}
    </div>

      <div class="items-ed" id="itemsEd" data-fee="1">${items.map((it) => itemRowHTML(it, types, { fee: true })).join('')}</div>
      <div class="split"><button type="button" class="btn sm soft" data-act="addItemRow">${icon('plus', 'sm')}Yana buyum</button><b class="tnum" id="itemsTotal"></b></div>
      <div class="hint">Har bir buyumga kelishilgan usta pulini yozing (bitta umumiy summa bo‘lsa — bittasiga yozing). Turiga qarab ishlar o‘zi qo‘shiladi, xuddi o‘z buyurtmangizdek; keraksizini bosib o‘chirasiz.</div></div>
    ${field('Topshirish muddati', dateInp('deadline', base.deadline))}
    ${field('Ish joyi', textInp('address', base.address, 'Qayerda yig‘iladi yoki o‘rnatiladi'))}
    ${field('Tafsilotlar', `<textarea class="inp" name="note" rows="3" placeholder="O‘lchamlar, rang, shartlar, nima olib borish kerak…">${esc(base.note || '')}</textarea>`, { full: true })}
    ${isNew ? field('Bosqich', opts('stage', [['olchov', 'O‘lchov'], ['kelishildi', 'Qabul qilindi']], 'kelishildi'), { full: true, hint: 'Usta puli kelishilgan bo‘lsa — «Qabul qilindi», ish darhol ishlab chiqarish doskasiga tushadi. Avval o‘lchab, keyin kelishiladigan bo‘lsa — «O‘lchov».' }) : ''}
    ${isNew ? `<div class="full fgrid" style="padding:14px;border-radius:14px;background:var(--surface-2)">
      <div class="full"><div class="lbl">Avans oldingizmi?</div><div class="hint muted" style="font-size:12px;margin-top:2px">Olgan bo‘lsangiz yozing — kassaga «Hamkorlik: usta puli» kirimi bo‘lib tushadi.</div></div>
      ${field('Avans', numInp('adv', '', { curOf: 'advAcc' }))}
      ${field('Qaysi hisobga', accOpts('advAcc'))}</div>` : ''}
  </div>`;
  openForm({
    title: isNew ? 'Yangi hamkorlik ishi' : `Hamkorlik ${jNo(base)}`, sub: isNew ? 'Ish beruvchi, buyumlar va usta puli' : 'Tahrirlash', body, wide: true,
    onMount(form) {
      const box = $('#newPartnerBox', form);
      form.addEventListener('combonew', (e) => {
        if (!e.target.closest('[data-combo=partners]')) return;
        box.hidden = false; form.elements.np_name.value = e.detail.text || '';
        $('input[type=hidden][name=partnerId]', form).value = ''; $('#f_partner', form).value = '';
        form.elements.np_name.focus();
      });
      form.addEventListener('combo', (e) => { if (e.target.closest('[data-combo=partners]')) box.hidden = true; });
    },
    onInput(form) {
      syncCur(form);
      const its = readItemRows(form); $('#itemsTotal', form).textContent = `Jami usta puli: ${som(sum(its, (x) => x.price))}`; showStepCounts(form, its);
    },
    async onSubmit(form) {
      let partnerId = val(form, 'partnerId');
      const newBox = !$('#newPartnerBox', form).hidden, npName = String(val(form, 'np_name') || '').trim();
      if (!partnerId && !newBox) return fieldErr(form, 'partnerId', 'Ish beruvchini tanlang yoki «Yangi ish beruvchi» qo‘shing');
      if (!partnerId && !npName) return fieldErr(form, 'np_name', 'Ish beruvchi nomini yozing');
      const its = readItemRows(form, isNew ? [] : itemsOf(j));
      if (!its.length) return toast('Kamida bitta buyum qo‘shing', true), false;
      return guard(async () => {
        if (!partnerId) { const p = await save('partners', { name: npName, phone: String(val(form, 'np_phone')).trim(), createdAt: M.today }); partnerId = p.id; }
        const rec = isNew ? { no: nextNo(Store.data.jobs), createdAt: M.today, stage: val(form, 'stage') || 'kelishildi', history: [] } : { ...base, history: (base.history || []).slice() };
        const oldFee = N(base.fee), oldDeadline = base.deadline || '';

        toast(isNew ? `${jNo(saved)} qo‘shildi` : 'Saqlandi');
        if (isNew) setTimeout(() => A.openJob({ id: saved.id }), 60);
        return true;
      });
    },
  });
}
A.newJob = (d) => { if (needWrite()) jobForm(null, { pid: d.pid }); };
A.editJob = (d) => { const j = M.job.get(d.id); if (j && needWrite()) jobForm(j); };

/* ================= Bosqichlar: o‘z buyurtmasi bilan bir xil ================= */
async function setJobStage(j, stage, patch = {}, note = '') {
  const rec = { ...cloneUnit(j), ...patch, stage };
  addHist(rec, note || `Bosqich: ${stageOf(stage).name}`);
  return save('jobs', rec);
}
A.jobNext = (d) => {
  const j = M.job.get(d.id); if (!j || !needWrite()) return;
  const nx = STAGES[stageIdx(j.stage) + 1]; if (!nx) return;
  const head = `${jNo(j)} · ${esc(jPartner(j).name)}`;
  if (nx.id === 'kelishildi') {
    const its = itemsOf(j), paid = jPaid(j);
    openModal({
      title: 'Ish qabul qilindi', wide: true, body: `<p class="ink2">${head}. Har bir buyum uchun kelishilgan usta pulini yozing.</p>
        <div class="stack" style="gap:10px">${its.map((it) => `<div class="prow"><span class="pn">${esc(itemLabel(it))}</span><div>${numInp('p_' + it.id, it.price || '')}</div></div>`).join('')}</div>
        <div class="totals"><div class="big"><span>Jami usta puli</span><span id="kTot"></span></div></div>
        ${field('Topshirish muddati', dateInp('deadline', j.deadline || addDays(M.today, 7)))}
        ${paid > 0 ? `<div class="callout good">${icon('check')}<div class="grow">Avval olingan: <b>${som(paid)}</b>. Shu pulni qayta yozmang.</div></div>` : ''}
        <div class="fgrid">${field(paid > 0 ? 'Yana avans (ixtiyoriy)' : 'Avans (ixtiyoriy)', numInp('adv', '', { curOf: 'acc' }))}${field('Hisob', selectInp('acc', ACCOUNTS.map((a) => [a.id, a.name]), 'naqd'))}</div>`,
      acts: `<button type="button" class="btn" data-act="closeTop">Bekor qilish</button><button type="submit" class="btn primary">${icon('check', 'sm')}Qabul qilindi</button>`,
      onInput(f) { syncCur(f); $('#kTot', f).textContent = som(sum(its, (it) => numVal(f, 'p_' + it.id))); },
      async onSubmit(f) {
        if (sum(its, (it) => numVal(f, 'p_' + it.id)) <= 0) return fieldErr(f, 'p_' + its[0].id, 'Kelishilgan usta pulini yozing');
        return guard(async () => {
          const rec = cloneUnit(j);
          rec.items.forEach((it) => { it.price = numVal(f, 'p_' + it.id); });
          normJob(rec);
          Object.assign(rec, { stage: 'kelishildi', deadline: val(f, 'deadline') || null, agreedAt: M.today });
          addHist(rec, `Ish qabul qilindi: usta puli ${som(rec.fee)}`);
          syncStage(rec);
          await save('jobs', rec);
          const adv = numVal(f, 'adv');
          if (adv > 0) await save('tx', moneyTx({ type: 'kirim', category: 'hamkorlik', account: val(f, 'acc'), amount: adv, date: M.today, jobId: j.id, partnerId: j.partnerId, note: 'Avans' }));
          toast('Qabul qilindi — ishlab chiqarishga tushdi'); return true;
        });
      },
    });
  } else if (nx.id === 'ishlab') {
    guard(async () => {
      const rec = cloneUnit(j);
      Object.assign(rec, { stage: 'ishlab', startedAt: rec.startedAt || M.today });
      addHist(rec, 'Ishlab chiqarish boshlandi');
      syncStage(rec);
      await save('jobs', rec);
    }, `${jNo(j)} ishlab chiqarishda`);
  } else if (nx.id === 'tayyor') {
    const rec = cloneUnit(j), left = [];
    rec.items.forEach((it) => itemSteps(it).forEach((s) => { if (s.ph !== 'uy' && !it.done[s.id]) left.push([it, s]); }));
    const run = () => guard(async () => {
      for (const [it, s] of left) it.done[s.id] = { d: M.today, w: null };
      Object.assign(rec, { stage: 'tayyor', readyAt: M.today, startedAt: rec.startedAt || M.today });
      addHist(rec, 'Tayyor — yetkazish va o‘rnatishga');
      await save('jobs', rec);
    }, `${jNo(j)} tayyor`);
    if (!left.length) return run();
    confirmBox({ title: 'Tayyor deb belgilaysizmi?', text: `${left.length} ta ish hali belgilanmagan. Ular bajarildi deb belgilanadi.`, ok: 'Ha, tayyor' }).then((ok) => { if (ok) run(); });
  } else if (nx.id === 'ornatildi') {
    const debt = jDebt(j);
    const leftN = itemsOf(j).reduce((a, it) => a + itemInfo(j, it).left.length, 0);
    openModal({
      title: 'O‘rnatildi', body: `<p class="ink2">${head} — ish topshirildi.</p>
        ${field('Topshirilgan sana', dateInp('doneAt', M.today))}
        ${leftN ? `<div class="callout info">${icon('check')}<div class="grow">Belgilanmagan ${leftN} ta ish ham bajarildi deb belgilanadi.</div></div>` : ''}
        ${debt > 0 ? `<div class="callout oak">${icon('coins')}<div class="grow">Ish beruvchidan qoldiq: <b>${som(debt)}</b>${jReimb(j) ? ` (usta puli + xarajat ${som(jReimb(j))})` : ''}. Pulni olgan bo‘lsangiz, quyida yozing.</div><button type="button" class="btn sm" data-act="fillDebt" data-v="${debt}">Hammasini</button></div>
        <div class="fgrid">${field('Olingan pul', numInp('pay', '', { curOf: 'acc' }))}${field('Hisob', selectInp('acc', ACCOUNTS.map((a) => [a.id, a.name]), 'naqd'))}</div>` : `<div class="callout good">${icon('check')}<div class="grow">Ish beruvchidan hammasi olingan.</div></div>`}`,
      acts: `<button type="button" class="btn" data-act="closeTop">Bekor qilish</button><button type="submit" class="btn primary">${icon('check', 'sm')}Topshirildi</button>`,
      onInput: syncCur,
      async onSubmit(f) {
        return guard(async () => {
          const doneAt = val(f, 'doneAt') || M.today;
          const rec = cloneUnit(j);
          rec.items.forEach((it) => itemSteps(it).forEach((s) => { if (!it.done[s.id]) it.done[s.id] = { d: doneAt, w: null }; }));
          Object.assign(rec, { stage: 'ornatildi', doneAt, startedAt: rec.startedAt || doneAt });
          addHist(rec, 'O‘rnatildi, ish beruvchiga topshirildi');
          await save('jobs', rec);
          const pay = numVal(f, 'pay');
          if (pay > 0) await save('tx', moneyTx({ type: 'kirim', category: 'hamkorlik', account: val(f, 'acc') || 'naqd', amount: pay, date: doneAt, jobId: j.id, partnerId: j.partnerId, note: 'Yakuniy to‘lov' }));
          toast(`${jNo(j)} topshirildi`); return true;
        });
      },
    });
  }
};
A.jobPrev = async (d) => {
  const j = M.job.get(d.id); if (!j || !needWrite()) return;
  const pv = STAGES[stageIdx(j.stage) - 1]; if (!pv) return;
  if (!(await confirmBox({ title: `«${pv.name}» bosqichiga qaytarasizmi?`, text: 'Kassadagi yozuvlar o‘zgarmaydi.', ok: 'Qaytarish' }))) return;
  guard(() => setJobStage(j, pv.id, j.stage === 'ornatildi' ? { doneAt: null } : {}, `Orqaga qaytarildi: ${pv.name}`), 'Bosqich o‘zgardi');
};
A.jobCancel = (d) => {
  const j = M.job.get(d.id); if (!j || !needWrite()) return;

      <div class="fgrid">${field('Summa', numInp('amount', '', { curOf: 'acc' }), { req: true })}${field('Sana', dateInp('date', M.today))}</div>
      ${field('Qaysi hisobdan', selectInp('acc', ACCOUNTS.map((a) => [a.id, a.name]), 'naqd'))}
      ${field('Izoh', textInp('note', '', 'Masalan: taksi, shurup va silikon, yordamchi'))}`,
    acts: `<button type="button" class="btn" data-act="closeTop">Bekor qilish</button><button type="submit" class="btn primary">${icon('check', 'sm')}Kassadan chiqim</button>`,
    onInput(f) { syncCur(f); const wp = val(f, 'category') === 'ish_haqi'; $('#jwBox', f).hidden = !wp; $('#jrBox', f).hidden = wp; },

      const category = val(f, 'category') || 'boshqa', wid = category === 'ish_haqi' ? val(f, 'workerId') : '';
      if (category === 'ish_haqi' && !wid) return fieldErr(f, 'workerId', 'Ishchini tanlang');
      const date = val(f, 'date') || M.today, note = String(val(f, 'note')).trim();
      const reimb = !wid && !!val(f, 'reimb');

        await save('tx', tx);
      }, reimb ? 'Xarajat yozildi — ish beruvchi qarziga qo‘shildi' : 'Xarajat yozildi');

  });
};

/* ================= Web version: Supabase (login by name + password) =================
   The app talks to a small "db" object shaped like the artifact db, so the Store code stays the same.
   Every record is one row in public.records (kind, id, data). */
window.AvaldoWeb = (() => {
  const CFG = window.AVALDO_CFG || {};
  const DOMAIN = '@avaldo-crm.com';
  const TABLE = 'records';
  let sb = null, uidNow = null, member = null, members = [], loaded = false;
  const cache = {}, subs = {};
  const LOGK = ['tx', 'moves', 'work'];

  const slug = (s) => String(s || '').trim().toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[‘’ʻʼ'`´]/g, '').replace(/[^a-z0-9._-]/g, '');
  const toEmail = (name) => slug(name) + DOMAIN;
  const kindMap = (k) => cache[k] || (cache[k] = new Map());
  const esc2 = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- snapshots for the Store code ---------- */
  function snapshot(kind) {
    const m = kindMap(kind);
    if (kind === 'meta') { const s = m.get('settings'); return { exists: !!s, data: () => s || {} }; }
    if (LOGK.includes(kind)) {
      const b = {};
      for (const [id, v] of m) { const mo = String((v && v.date) || '').slice(0, 7) || 'x'; (b[mo] = b[mo] || {})[id] = v; }
      return { docs: Object.keys(b).map((mo) => ({ exists: true, id: mo, data: () => ({ items: b[mo] }) })) };
    }
    return { docs: [...m].map(([id, v]) => ({ exists: true, id, data: () => v })) };
  }
  function emit(kind) { for (const cb of subs[kind] || []) { try { cb(snapshot(kind)); } catch (e) { console.error(e); } } }
  const emitAll = () => { for (const k of Object.keys(subs)) emit(k); };
  function sub(kind, cb) { (subs[kind] = subs[kind] || []).push(cb); if (loaded) Promise.resolve().then(() => cb(snapshot(kind))); }

  /* ---------- writes ---------- */
  const fail = (e) => { const c = e && (e.code || e.status); throw { code: c === '42501' || c === 401 || c === 403 ? 'invalid_argument' : 'net', raw: e }; };
  async function upsertRows(kind, entries) {
    const rows = entries.map(([id, data]) => ({ kind, id, data }));
    for (let i = 0; i < rows.length; i += 400) {
      const { error } = await sb.from(TABLE).upsert(rows.slice(i, i + 400), { onConflict: 'kind,id' });
      if (error) fail(error);
    }
    const m = kindMap(kind); for (const [id, data] of entries) m.set(id, data); emit(kind);
  }
  async function deleteRows(kind, ids) {
    for (let i = 0; i < ids.length; i += 100) {
      const { error } = await sb.from(TABLE).delete().eq('kind', kind).in('id', ids.slice(i, i + 100));
      if (error) fail(error);
    }
    const m = kindMap(kind); for (const id of ids) m.delete(id); emit(kind);
  }
  const clean = (o) => { const r = {}; for (const [k, v] of Object.entries(o || {})) if (v !== undefined) r[k] = v; return r; };
  function ref(kind, id) {
    return {
      async set(body) {
        if (LOGK.includes(kind)) return this.update(body);
        return upsertRows(kind, [[id, clean(body)]]);
      },
      async update(body) {
        if (!LOGK.includes(kind)) return upsertRows(kind, [[id, { ...(kindMap(kind).get(id) || {}), ...clean(body) }]]);
        const put = [], del = [];
        for (const [rid, v] of Object.entries((body && body.items) || {})) { if (v === null) del.push(rid); else put.push([rid, v]); }
        if (put.length) await upsertRows(kind, put);
        if (del.length) await deleteRows(kind, del);
      },
      async delete() { return deleteRows(kind, [id]); },
      async get() { return LOGK.includes(kind) ? { exists: true } : { exists: kindMap(kind).has(id), data: () => kindMap(kind).get(id) }; },
      onSnapshot(cb) { sub(kind, cb); },
    };
  }
  const db = {
    collection: (kind) => ({ doc: (id) => ref(kind, id), onSnapshot: (cb) => sub(kind, cb) }),
    doc: (path) => { const [k, id] = path.split('/'); return ref(k, id); },
  };

  /* ---------- reading ---------- */
  async function loadAll() {
    const fresh = {};
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from(TABLE).select('kind,id,data').order('kind').order('id').range(from, from + 999);
      if (error) throw error;
      for (const r of data) (fresh[r.kind] = fresh[r.kind] || new Map()).set(r.id, r.data);
      if (data.length < 1000) break;
    }
    for (const k of Object.keys(cache)) delete cache[k];
    Object.assign(cache, fresh);
    loaded = true; emitAll();
  }
  function listen() {
    sb.channel('records-live').on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, (p) => {
      if (p.eventType === 'DELETE') { const o = p.old || {}; if (o.kind && o.id) { kindMap(o.kind).delete(o.id); emit(o.kind); } }
      else { const n = p.new || {}; if (n.kind && n.id) { kindMap(n.kind).set(n.id, n.data); emit(n.kind); } }
    }).subscribe();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadAll().catch(() => {}); });
  }

  /* ---------- sign-in screen ---------- */
  function screen(html) {
    let el = document.getElementById('authScr');
    if (!el) { el = document.createElement('div'); el.id = 'authScr'; el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto'; document.body.append(el); }
    el.innerHTML = `<div style="width:100%;max-width:360px">${html}</div>`;
    return el;
  }
  const hideScreen = () => { const el = document.getElementById('authScr'); if (el) el.remove(); };
  const head = (t, s) => `<div style="text-align:center;margin-bottom:22px"><div style="width:64px;height:64px;border-radius:16px;background:var(--accent);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 28px 'Bricolage Grotesque',sans-serif">A</div><div style="font:700 22px 'Bricolage Grotesque',sans-serif">${t}</div><div class="muted" style="margin-top:4px;font-size:14px">${s}</div></div>`;
  const loginForm = (setup) => `${head('avaldo.crm', setup ? 'Birinchi marta: egasi akkauntini yarating' : 'Kirish')}
    <form id="authF" class="stack" style="gap:12px" autocomplete="on">
      <div class="field"><label>Ism</label><input class="inp" name="u" autocomplete="username" autocapitalize="none" autocorrect="off" required placeholder="Masalan: Avaldo"></div>
      <div class="field"><label>Parol</label><input class="inp" type="password" name="p" autocomplete="${setup ? 'new-password' : 'current-password'}" required minlength="6" placeholder="Kamida 6 ta belgi"></div>
      <div id="authErr" style="color:var(--bad,#b3261e);font-size:13.5px;min-height:18px"></div>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center">${setup ? 'Akkaunt yaratish' : 'Kirish'}</button>
    </form>`;
  function ask(setup) {
    return new Promise((resolve) => {
      const el = screen(loginForm(setup)); const f = el.querySelector('#authF'), err = el.querySelector('#authErr');
      f.addEventListener('submit', async (e) => {
        e.preventDefault(); err.textContent = ''; const btn = f.querySelector('button'); btn.disabled = true;
        const name = f.u.value.trim(), pass = f.p.value;
        try {
          if (!slug(name)) throw new Error('Ismni lotin harflarida yozing');
          const email = toEmail(name);
          if (setup) {
            const { data, error } = await sb.auth.signUp({ email, password: pass });
            if (error) throw error;
            if (!data.session) throw new Error('Supabase\'da «Confirm email» yoqilgan. Uni o‘chiring.');
            const { error: e2 } = await sb.rpc('claim_owner', { p_login: slug(name), p_name: name });
            if (e2) throw e2;
          } else {
            const { error } = await sb.auth.signInWithPassword({ email, password: pass });
            if (error) throw new Error('Ism yoki parol noto‘g‘ri');
          }
          resolve();
        } catch (x) { err.textContent = x.message || 'Xatolik'; btn.disabled = false; }
      });
    });
  }
  function noAccess(msg) {
    const el = screen(`${head('avaldo.crm', msg)}<button class="btn" id="outB" style="width:100%;justify-content:center">Chiqish</button>`);
    el.querySelector('#outB').onclick = logout;
  }
  async function logout() {
    try { await sb.auth.signOut(); } catch (e) {}
    try { localStorage.removeItem('avaldo_role'); } catch (e) {}
    location.reload();
  }

  /* ---------- start ---------- */
  async function init() {
    if (!CFG.url || !CFG.key || !window.supabase) { screen(head('avaldo.crm', 'Sozlanmagan: config.js ichiga Supabase URL va kalit yozilmagan.')); return; }
    sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } });
    Store.dl = { save: async ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' })); a.download = filename; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); } };
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      let setup = false;
      try { const r = await sb.rpc('has_owner'); setup = r.data === false; } catch (e) {}
      await ask(setup);
      ({ data: { session } } = await sb.auth.getSession());
    }
    uidNow = session.user.id;
    const { data: me } = await sb.from('members').select('*').eq('user_id', uidNow).maybeSingle();
    if (!me || me.role === 'off') { noAccess(me ? 'Sizning kirishingiz yopilgan.' : 'Sizga ruxsat berilmagan. Egasiga murojaat qiling.'); return; }
    member = me;
    Store.me = uidNow; Store.myName = me.name || me.login;
    const names = {};
    const refreshMembers = async () => { const { data } = await sb.from('members').select('*'); members = data || []; for (const m of members) names[m.user_id] = m.name || m.login; };
    await refreshMembers();
    Store.user = { profiles: async (ids) => Object.fromEntries(ids.map((i) => [i, { name: names[i] }])), id: async () => uidNow, isOwner: async () => me.role === 'owner' };
    setRole(me.role === 'owner' ? 'owner' : 'worker');
    window.AvaldoWeb._refreshMembers = refreshMembers;
    Store.mode = 'cloud'; Store.db = db;
    const own = me.role === 'owner';
    const need = ALL.length + 1;
    const mark = (k) => { Store.loaded.add(k); if (!Store.ready && Store.loaded.size >= need) Store.ready = true; changed(); };
    const ents = own ? ENTS : W_ENTS, logs = own ? LOGS : [];
    for (const k of ALL) if (!ents.includes(k) && !logs.includes(k)) Store.loaded.add(k);
    for (const name of ents) db.collection(name).onSnapshot((snap) => { Store.data[name] = snap.docs.map((d) => ({ ...d.data(), id: d.id })); mark(name); });
    for (const name of logs) db.collection(name).onSnapshot((snap) => {
      const out = []; for (const d of snap.docs) { const items = d.data().items; for (const k of Object.keys(items)) if (items[k] && typeof items[k] === 'object') out.push({ ...items[k], id: k, _b: d.id }); }
      Store.data[name] = out; mark(name);
    });
    db.doc('meta/settings').onSnapshot((s) => { Store.settings = { ...DEF_SETTINGS, ...(s.exists ? s.data() : {}) }; mark('settings'); });
    try { await loadAll(); } catch (e) { console.error(e); toast('Ma’lumotni yuklab bo‘lmadi', true); Store.ready = true; changed(); }
    hideScreen(); listen();
  }

  /* ---------- worker accounts (owner) ---------- */
  function workersCard() {
    if (!member || member.role !== 'owner') return '';
    const ws = members.filter((m) => m.role !== 'owner');
    return `<section class="card"><div class="card-h"><h3>Ishchilar uchun kirish</h3></div><div class="card-b stack">
      <p class="ink2">Ishchi o‘zining ismi va paroli bilan kiradi. U faqat <b>Ishlab chiqarish</b> va <b>Buyurtmalar</b>ni ko‘radi. Narx, to‘lov, kassa va ish haqi ko‘rinmaydi.</p>
      <div class="rows">${ws.map((m) => `<div class="rowi" style="cursor:default"><div class="av">${esc2((m.name || m.login).slice(0, 1).toUpperCase())}</div><div class="rm"><div class="rt">${esc2(m.name || m.login)}${m.role === 'off' ? ' · yopilgan' : ''}</div><div class="rs">Kirish ismi: ${esc2(m.login)}</div></div>
        <button class="btn sm" data-act="webWorkerPass" data-id="${m.user_id}">Parol</button><button class="btn sm ${m.role === 'off' ? '' : 'badb'}" data-act="webWorkerToggle" data-id="${m.user_id}">${m.role === 'off' ? 'Ochish' : 'Yopish'}</button></div>`).join('') || '<p class="muted">Hali ishchi qo‘shilmagan.</p>'}</div>
      <div class="gap"><button class="btn primary" data-act="webAddWorker">${icon('plus', 'sm')}Ishchi qo‘shish</button><button class="btn" data-act="webMyPass">Mening parolim</button></div>
      <p class="muted" style="font-size:12.5px">Ishchiga saytning havolasini, ismini va parolini bering. Kim qaysi ishni belgilagani buyurtma tarixida ko‘rinadi.</p>
    </div></section>`;
  }
  async function newLogin(name, pass, workerId) {
    const login = slug(name), email = toEmail(name);
    const tmp = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'tmp-' + Date.now() } });
    const { error } = await tmp.auth.signUp({ email, password: pass });
    if (error && !/registered|exists/i.test(error.message)) throw error;
    const { error: e2 } = await sb.rpc('adopt_login', { p_email: email, p_login: login, p_name: name.trim(), p_password: pass, p_worker: workerId || '' });
    if (e2) throw e2;
  }
  const pwdFields = (label) => `<div class="fgrid">${field(label, `<input class="inp" name="pw" type="text" autocomplete="off" autocapitalize="none" minlength="6" required placeholder="Kamida 6 ta belgi">`, { full: true, req: true })}</div>`;
  const reload = async () => { await window.AvaldoWeb._refreshMembers(); changed(); };

  A.webLogout = () => logout();
  A.webAddWorker = () => openForm({
    title: 'Yangi ishchi', sub: 'Ismi va paroli bilan kiradi',
    body: `<div class="fgrid">${field('Ismi', textInp('nm', '', 'Masalan: Anvar'), { full: true, req: true, hint: 'Lotin harflarida. Shu ism bilan kiradi.' })}${field('Parol', `<input class="inp" name="pw" type="text" autocomplete="off" autocapitalize="none" minlength="6" required placeholder="Kamida 6 ta belgi">`, { full: true, req: true })}</div>`,
    async onSubmit(f) {
      const nm = String(val(f, 'nm')).trim(), pw = String(val(f, 'pw')).trim();
      if (!slug(nm)) return fieldErr(f, 'nm', 'Ismni lotin harflarida yozing');
      if (pw.length < 6) return fieldErr(f, 'pw', 'Kamida 6 ta belgi');
      const ok = await guard(() => newLogin(nm, pw), 'Ishchi qo‘shildi');
      if (ok) await reload();
      return ok;
    },
  });
  A.webWorkerPass = (d) => {
    const m = members.find((x) => x.user_id === d.id); if (!m) return;
    openForm({
      title: `${m.name || m.login}: yangi parol`, sub: 'Ishchiga yangi parolni ayting', body: pwdFields('Yangi parol'),
      async onSubmit(f) {
        const pw = String(val(f, 'pw')).trim(); if (pw.length < 6) return fieldErr(f, 'pw', 'Kamida 6 ta belgi');
        return guard(async () => { const { error } = await sb.rpc('set_member_password', { p_user: m.user_id, p_password: pw }); if (error) throw error; }, 'Parol almashtirildi');
      },
    });
  };
  A.webWorkerToggle = async (d) => {
    const m = members.find((x) => x.user_id === d.id); if (!m) return;
    const off = m.role !== 'off';
    if (off && !(await confirmBox({ title: `«${esc2(m.name || m.login)}» kirishi yopilsinmi?`, ok: 'Yopish', danger: true }))) return;
    const ok = await guard(async () => { const { error } = await sb.from('members').update({ role: off ? 'off' : 'worker' }).eq('user_id', m.user_id); if (error) throw error; }, off ? 'Yopildi' : 'Ochildi');
    if (ok) await reload();
  };
  A.webMyPass = () => openForm({
    title: 'Mening parolim', sub: 'Yangi parol', body: pwdFields('Yangi parol'),
    async onSubmit(f) {
      const pw = String(val(f, 'pw')).trim(); if (pw.length < 6) return fieldErr(f, 'pw', 'Kamida 6 ta belgi');
      return guard(async () => { const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw error; }, 'Parol almashtirildi');
    },
  });

  /* ---------- load a backup made by the old (Claude) version ---------- */
  A.webImport = () => {
    if (!needWrite()) return;
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => {
      const file = inp.files && inp.files[0]; if (!file) return;
      let o; try { o = JSON.parse(await file.text()); } catch (e) { return toast('Fayl o‘qilmadi', true); }
      if (!o || o.app !== 'avaldo.crm') return toast('Bu avaldo.crm zaxira fayli emas', true);
      const n = ALL.reduce((s, k) => s + (Array.isArray(o[k]) ? o[k].length : 0), 0);
      if (!(await confirmBox({ title: `${fmt(n)} ta yozuv yuklansinmi?`, text: 'Bir xil raqamli yozuvlar almashtiriladi. Boshqalar o‘chmaydi.', ok: 'Yuklash' }))) return;
      const ok = await guard(async () => {
        for (const k of ALL) {
          const arr = Array.isArray(o[k]) ? o[k] : []; if (!arr.length) continue;
          const entries = arr.filter((r) => r && r.id).map((r) => { const c = { ...r }; delete c._b; delete c.id; return [r.id, LOGK.includes(k) ? shapeLog(k, c) : cleanEnt(c)]; });
          await upsertRows(k, entries);
        }
        if (o.settings) await saveSettings(o.settings);
      }, 'Yuklandi');
      if (ok) { await loadAll(); }
    };
    inp.click();
  };

  return { init, workersCard, _refreshMembers: async () => {} };
})();

/* ================= Boot ================= */
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (h !== UI.view && VIEWS.some((v) => v.id === h)) go(h); });
(function boot() {
  const h = (location.hash || '').replace('#', '');
  if (VIEWS.some((v) => v.id === h)) UI.view = h;
  /* the role remembered on this device shows the right tabs at once; on a first visit the tabs wait for it */
  let r0 = null; try { r0 = localStorage.getItem('avaldo_role'); } catch (e) {}
  if (r0 === 'worker') { Store.role = 'worker'; document.body.classList.add('wk'); if (!W_VIEWS.includes(UI.view)) UI.view = 'sex'; }
  else if (!r0 && window.claude) { document.body.classList.add('boot'); setTimeout(() => document.body.classList.remove('boot'), 12000); }
  compute();
  renderAll();
  initStore();
  setInterval(() => { if (M && M.today !== today()) changed(); }, 60000);
})();

</script>
