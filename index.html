<meta charset="utf-8">
<style>
/* Layout: workshop ledger — a module rail on the left, a wide working bench, and job sheets that slide in from the right like a work order clipped to the bench */
:root{
  --bg:#ECEEE9; --surface:#FFFFFF; --surface-2:#F5F6F2; --sunk:#E4E7E1;
  --ink:#16201B; --ink-2:#46514B; --muted:#76817B; --line:#DADFD8; --line-2:#C7CEC6;
  --accent:#1C5946; --accent-2:#154737; --accent-ink:#FFFFFF; --accent-soft:#DCECE5;
  --oak:#B07228; --oak-soft:#F3E6D2; --oak-ink:#6B4313;
  --plum:#6C4AA8; --plum-soft:#ECE5F7;
  --good:#1D7746; --good-soft:#DDF0E4; --warn:#A35F00; --warn-soft:#F9EAD1; --bad:#BA3A27; --bad-soft:#F9DED9; --info:#2A5FA6; --info-soft:#DFE8F5;
  --overlay:rgba(12,18,15,.45);
  --shadow-sm:0 1px 2px rgba(22,32,27,.06);
  --shadow:0 1px 2px rgba(22,32,27,.05),0 12px 30px -14px rgba(22,32,27,.22);
  --shadow-lg:0 30px 70px -24px rgba(22,32,27,.45);
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --f-display:"Bricolage Grotesque","Onest",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rail:236px;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D110F; --surface:#151A17; --surface-2:#1A201D; --sunk:#0A0D0B;
  --ink:#E5EBE7; --ink-2:#B4BFB9; --muted:#85908A; --line:#262E2A; --line-2:#35403A;
  --accent:#5DB897; --accent-2:#7BCAAD; --accent-ink:#04110B; --accent-soft:#15302A;
  --oak:#DCA05B; --oak-soft:#2B2116; --oak-ink:#F0C590;
  --plum:#B59AE8; --plum-soft:#251D36;
  --good:#4DBE7E; --good-soft:#132E1E; --warn:#E3A23D; --warn-soft:#32250D; --bad:#F27966; --bad-soft:#381914; --info:#77A8F1; --info-soft:#15243B;
  --overlay:rgba(0,0,0,.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.85);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D110F; --surface:#151A17; --surface-2:#1A201D; --sunk:#0A0D0B;
  --ink:#E5EBE7; --ink-2:#B4BFB9; --muted:#85908A; --line:#262E2A; --line-2:#35403A;
  --accent:#5DB897; --accent-2:#7BCAAD; --accent-ink:#04110B; --accent-soft:#15302A;
  --oak:#DCA05B; --oak-soft:#2B2116; --oak-ink:#F0C590;
  --plum:#B59AE8; --plum-soft:#251D36;
  --good:#4DBE7E; --good-soft:#132E1E; --warn:#E3A23D; --warn-soft:#32250D; --bad:#F27966; --bad-soft:#381914; --info:#77A8F1; --info-soft:#15243B;
  --overlay:rgba(0,0,0,.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.85);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:24px;height:24px}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.good-t{color:var(--good)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.nowrap{white-space:nowrap}
.r{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:18px 14px 16px calc(14px + env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:800 20px/1 var(--f-display);letter-spacing:-.02em;display:block}
.brand b span{color:var(--oak)}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--oak);font-weight:700;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0}
.nav a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:99px;font-size:11.5px;font-weight:700;display:grid;place-items:center;background:var(--bad);color:#fff}
.nav a .cnt.w{background:var(--warn)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.rail-foot{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.rail-foot .row1{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.rail-foot .rate{display:flex;justify-content:space-between;align-items:center}

.main{min-width:0;padding-left:var(--gl);padding-right:var(--gr);padding-block:0 56px}
@media (min-width:861px){.main{--gl:24px;--gr:max(24px,env(safe-area-inset-right,0px))}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;margin-inline:calc(-1 * var(--gl)) calc(-1 * var(--gr));padding:14px var(--gr) 14px var(--gl);background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topbar .ttl{min-width:0;flex:1}
.topbar h1{font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:2px}
.topbar .tb-actions{display:flex;gap:8px;align-items:center}
.search{position:relative;width:min(300px,34vw)}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:38px}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto}
.search-res button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer}
.search-res button:hover,.search-res button.hi{background:var(--surface-2)}
.search-res .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px;font-weight:700}
.view{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.tabbar{display:none}
.fab{display:none}
.tb-actions .mob-only{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .topbar{padding-block:12px}
  .topbar h1{font-size:21px}
  .search{display:none}
  .tb-new{display:none}
  .tb-actions .mob-only{display:inline-flex}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px var(--gr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--surface);border-top:1px solid var(--line)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;position:relative;min-width:0}
  .tabbar a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar a.on{color:var(--accent)}
  .tabbar a .dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
  .fab{display:grid;place-items:center;position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-lg);cursor:pointer}
  .fab svg{width:26px;height:26px}
}

/* ===== Primitives ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.soft:hover{border-color:var(--accent)}
.btn.oak{background:var(--oak-soft);border-color:transparent;color:var(--oak-ink)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.badb{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px;gap:6px}
.btn.lg{height:50px;padding:0 22px;font-size:15.5px;border-radius:14px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.oak{background:var(--oak-soft);color:var(--oak-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plum{background:var(--plum-soft);color:var(--plum)}
.pill.outline{background:transparent;border-color:var(--line-2)}
.s1{--sc:var(--info);--ss:var(--info-soft)} .s2{--sc:var(--oak);--ss:var(--oak-soft)} .s3{--sc:var(--accent);--ss:var(--accent-soft)} .s4{--sc:var(--plum);--ss:var(--plum-soft)} .s5{--sc:var(--good);--ss:var(--good-soft)} .s0{--sc:var(--muted);--ss:var(--surface-2)}
.pill.st{background:var(--ss);color:var(--sc)}
.pill.st.s2{color:var(--oak-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.card-h h3{font-size:17px;flex:1;min-width:0}
.card-b{padding:8px 18px 18px}
.sec-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px;flex:1;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:180px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:600 13px var(--f-body);cursor:pointer;white-space:nowrap;flex:none}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted))}

.seg{display:inline-flex;padding:4px;gap:4px;background:var(--sunk);border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

.inp{height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body);width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
select.inp{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--muted);opacity:.8}
.inp.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.inp.sm{height:36px;font-size:14px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:650;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.req{color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.affix{position:relative;display:flex;align-items:center}
.affix .inp{padding-right:58px}
.affix .suf{position:absolute;right:12px;font-size:13px;color:var(--muted);font-weight:600;pointer-events:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.opt:hover{border-color:var(--ink-2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt small{font-weight:500;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}

/* combobox */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:240px;overflow:auto;padding:4px}
.combo-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:9px;background:none;cursor:pointer;font-size:14px}
.combo-list button:hover,.combo-list button.hi{background:var(--surface-2)}
.combo-list button small{color:var(--muted);white-space:nowrap}
.combo-list .new{color:var(--accent);font-weight:650}
.combo-list .none{padding:10px;color:var(--muted);font-size:13px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--surface-2)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.tbl .t1{font-weight:650}
.tbl .t2{font-size:12.5px;color:var(--muted)}
.tbl.compact td{padding:9px 12px}
.tbl.compact th{padding:9px 12px}
@media (max-width:640px){.hide-sm{display:none}}
.only-sm{display:none}
@media (max-width:640px){.only-sm{display:flex}.sm-meta{flex-wrap:wrap;gap:6px;margin-top:7px}}
@media (max-width:1100px){.hide-md{display:none}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.kpi .v{font:700 clamp(21px,2.1vw,28px)/1.1 var(--f-display);letter-spacing:-.015em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font:600 14px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:2px}
.kpi .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .k,.kpi.hero .s,.kpi.hero .v small{color:var(--accent-ink);opacity:.78}
.kpi.hero .accs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;opacity:.9;font-variant-numeric:tabular-nums}

/* alerts */
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;min-width:0}
.alert:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.alert .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.alert.bad .ic{background:var(--bad-soft);color:var(--bad)}
.alert.warn .ic{background:var(--warn-soft);color:var(--warn)}
.alert.info .ic{background:var(--info-soft);color:var(--info)}
.alert.oak .ic{background:var(--oak-soft);color:var(--oak)}
.alert.good .ic{background:var(--good-soft);color:var(--good)}
.alert .t{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.alert .d{font-size:13px;color:var(--muted);margin-top:2px}
.alert>div{min-width:0}

/* measuring tape pipeline */
.tape-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid color-mix(in srgb,var(--oak) 35%,var(--line))}
.tape{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));background:
  repeating-linear-gradient(90deg,var(--oak) 0 1px,transparent 1px 50px) 0 0/100% 15px no-repeat,
  repeating-linear-gradient(90deg,var(--oak) 0 1px,transparent 1px 10px) 0 0/100% 8px no-repeat,
  var(--oak-soft)}
.tape button{display:flex;flex-direction:column;gap:4px;padding:26px 16px 14px;border:0;border-left:1px dashed color-mix(in srgb,var(--oak) 50%,transparent);background:transparent;text-align:left;cursor:pointer;min-width:0;color:var(--oak-ink)}
.tape button:first-child{border-left:0}
.tape button:hover{background:color-mix(in srgb,var(--oak) 10%,transparent)}
.tape .no{font:700 11px var(--f-body);letter-spacing:.12em;opacity:.75}
.tape .nm{font-weight:700;font-size:14px;color:var(--ink)}
.tape .cn{font:800 30px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.tape .sm{font-size:12.5px;font-variant-numeric:tabular-nums}

.cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.cols2.top{align-items:start}
@media (max-width:1100px){.cols2{grid-template-columns:minmax(0,1fr)}}

/* list rows inside cards */
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rowi:last-child{border-bottom:0}
.rowi:hover .rt{color:var(--accent)}
.rowi .rm{flex:1;min-width:0}
.rowi .rt{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .rs{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .rv{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:700 14px var(--f-display);flex:none;background:var(--surface-2);color:var(--ink-2)}
.av.in{background:var(--good-soft);color:var(--good)}
.av.out{background:var(--bad-soft);color:var(--bad)}
.av.tr{background:var(--info-soft);color:var(--info)}

/* day groups */
.dgroup+.dgroup{margin-top:6px}
.dg-h{display:flex;align-items:baseline;gap:8px;padding:12px 0 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.dg-s{margin-left:auto;display:flex;gap:12px;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:650}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(204px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:140px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px}
.col-h b{font-size:14px}
.col-h .c{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface);border-radius:99px;padding:1px 8px}
.col-sum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 6px 0 18px;margin-top:-6px}
.col-h b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h .bar{width:4px;height:16px;border-radius:4px;background:var(--sc)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--shadow-sm);text-align:left;width:100%;min-width:0}
.ocard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ocard .top{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.ocard .no{font:700 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.ocard .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .pr{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.ocard .money{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.col .empty-col{font-size:13px;color:var(--muted);padding:14px 8px;text-align:center}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:5px;border-radius:9px;background:var(--line-2)}
.dots i.on{background:var(--accent)}
.dots i.cur{background:var(--oak)}
.mini-btn{align-self:stretch}

/* stage track */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.track .st{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.track .st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track .st i{height:6px;border-radius:9px;background:var(--line)}
.track .st.done i{background:var(--accent)}
.track .st.cur{color:var(--ink)}
.track .st.cur i{background:var(--oak)}

/* money trio */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio>div{padding:12px 14px;border-radius:14px;background:var(--surface-2);min-width:0}
.trio .k{font-size:12px;color:var(--muted);font-weight:650}
.trio .v{font:700 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:3px}
.trio .s{font-size:11.5px;line-height:1.3;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:480px){.trio .v{font-size:16px}}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:22px}
.kv dt{line-height:22px}
.kv .btn.icon{height:26px;width:26px;margin:-3px 0}

.block{display:flex;flex-direction:column;gap:12px}
.block>h4{font-size:15.5px;display:flex;align-items:center;gap:8px}
.block>h4 .act{margin-left:auto;display:flex;gap:6px}
.note{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13.5px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--info-soft);color:var(--info)}
.callout.good{background:var(--good-soft);color:var(--good)}
.callout.oak{background:var(--oak-soft);color:var(--oak-ink)}
.callout b{color:inherit}
.callout .grow{flex:1;min-width:0}

.hist{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.hist div{position:relative;padding:0 0 12px 16px;font-size:13.5px}
.hist div::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.hist small{display:block;color:var(--muted);font-size:12px}

/* smeta editor lines */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 108px 172px 32px;gap:8px;align-items:center}
.line.ex{grid-template-columns:minmax(0,1fr) 172px 32px}
.line .affix .inp{padding-right:52px}
.line .sum{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;grid-column:1/-1;margin-top:-4px}
.line-h{display:grid;grid-template-columns:minmax(0,1fr) 108px 172px 32px;gap:8px;font-size:12px;color:var(--muted);font-weight:650}
@media (max-width:560px){
  .line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px;grid-template-areas:"m m x" "q p p"}
  .line>.combo{grid-area:m}.line>.q{grid-area:q}.line>.p{grid-area:p}.line>.x{grid-area:x}
  .line-h{display:none}
  .line.ex{grid-template-columns:minmax(0,1fr) 120px 32px}
}
.totals{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .big{font:700 18px var(--f-display);border-top:1px dashed var(--line-2);padding-top:8px;margin-top:2px}

/* production board */
.pcard .stepbtn{display:flex;align-items:center;justify-content:center;gap:6px}
.pcard .top{flex-wrap:wrap}
.pcard .btn{white-space:normal;height:auto;min-height:32px;padding-block:6px;text-align:left;line-height:1.2}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;flex:none}
.prog i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));flex:none}

/* items (buyumlar) in forms */
.items-ed{display:flex;flex-direction:column;gap:10px}
.irow{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);min-width:0}
.irow-top{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) minmax(130px,170px) 40px;gap:8px;align-items:center;grid-template-areas:"t n p x"}
.irow-top>select{grid-area:t}.irow-top>input{grid-area:n}.irow-top>.affix{grid-area:p}.irow-top>.btn{grid-area:x}
.irow.single .irow-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"t p" "n n"}
@media (max-width:700px){.irow-top{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) 40px;grid-template-areas:"t p x" "n n n"}.irow.single .irow-top{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.irow .affix .inp{padding-right:46px}
.feats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.feats .lbl{margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;border:1px dashed var(--line-2);background:var(--surface);color:var(--muted);font:600 12.5px var(--f-body);cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--ink-2);color:var(--ink)}
.fchip.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.irow-bot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.opts.sm .opt{min-height:32px;padding:4px 12px;font-size:13px;border-radius:10px}
.modal.wide{width:min(640px,100%)}

/* items in order detail */
.ibox{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;min-width:0}
.ibox-h{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.ibox-t{flex:1;min-width:140px;font-weight:650;overflow-wrap:anywhere}
.ibox-p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
details.steps>summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px;padding:2px 0}
details.steps>summary::-webkit-details-marker{display:none}
details.steps>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
details.steps[open]>summary::before{transform:rotate(45deg)}
.ph{display:flex;flex-direction:column;margin-top:10px}
.ph-h{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:4px 0}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;border-radius:8px;color:var(--ink)}
.srow:hover{background:var(--surface-2)}
.srow[disabled]{cursor:default}
.srow[disabled]:hover{background:none}
.srow .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--accent-ink)}
.srow .cb .i{width:14px;height:14px;stroke-width:2.6}
.srow.done .cb{background:var(--accent);border-color:var(--accent)}
.srow.done .sn{color:var(--muted)}
.srow.cur .sn{font-weight:700}
.srow.cur .cb{border-color:var(--oak)}
.srow .sm{font-size:12px;color:var(--muted);text-align:right;max-width:240px;overflow-wrap:anywhere}
@media (max-width:560px){.srow{grid-template-columns:22px minmax(0,1fr)}.srow .sm{grid-column:2;text-align:left;max-width:none}}
.prow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.prow .pn{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.prow>div{width:min(190px,48%);flex:none}

/* step library (settings) */
.lib{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.lib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lib{grid-template-columns:minmax(0,1fr)}}
.lib-ph{padding:12px 14px;border-radius:14px;background:var(--surface-2);min-width:0}
.lib-ph ol{margin:6px 0 0;padding-left:26px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.lib-ph p{font-size:13px;color:var(--ink-2);margin-top:6px}
.tag{display:inline-block;margin-left:4px;color:var(--oak-ink);background:var(--oak-soft);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:650;white-space:nowrap}

/* bars chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:600 11px var(--f-body)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hbar .tr{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:9px;background:var(--oak)}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .vv{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}

/* accounts */
.accs-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.accs-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.accs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acc{padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left}
.acc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acc .k{font-size:12.5px;color:var(--muted);font-weight:650;display:flex;gap:6px;align-items:center}
.acc .v{font:700 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acc.total{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);cursor:default}
.acc.total .k{color:var(--accent-ink);opacity:.8}

.sumrow{display:flex;gap:10px;flex-wrap:wrap}
.sumrow>div{flex:1;min-width:140px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sumrow .k{font-size:12px;color:var(--muted);font-weight:650}
.sumrow .v{font:700 18px var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* sheets & modals */
.sheet-form{display:flex;flex-direction:column;flex:1;min-height:0}
body.ro [data-w]{display:none!important}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:var(--overlay);animation:fade .18s ease-out}
.sheet{position:relative;width:min(640px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideIn .26s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{width:min(860px,100%)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 22px;border-bottom:1px solid var(--line)}
.sheet-head .ht{flex:1;min-width:0}
.sheet-head h2{font-size:20px;overflow-wrap:anywhere}
.sheet-head .hs{font-size:13px;color:var(--muted);margin-top:2px}
.sheet-body{flex:1;overflow:auto;padding:20px max(22px,env(safe-area-inset-right,0px)) 30px 22px;display:flex;flex-direction:column;gap:22px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px max(22px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 22px;border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){
  .sheet-wrap{align-items:flex-end}
  .sheet,.sheet.wide{width:100%;height:auto;max-height:calc(100% - 18px - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0;animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
  .sheet-head{padding-top:14px;padding-left:var(--gl);padding-right:var(--gr)}
  .sheet-body{padding-left:var(--gl);padding-right:var(--gr)}
  .sheet-foot{padding-left:var(--gl);padding-right:var(--gr)}
  .sheet-foot .btn{flex:1}
  .sheet-foot .left{width:100%;margin:0}
  .sheet-foot .left .btn{flex:1}
}
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.modal{position:relative;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);padding:22px;display:flex;flex-direction:column;gap:16px;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal h3{font-size:19px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .acts .btn{min-width:110px}
@keyframes fade{from{opacity:0}}
@keyframes slideIn{from{transform:translateX(40px);opacity:.4}}
@keyframes slideUp{from{transform:translateY(60px);opacity:.4}}
@keyframes pop{from{transform:scale(.96);opacity:0}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast:nth-last-child(n+4){display:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .2s}
.toast.err{background:var(--bad);color:#fff}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px;color:var(--muted)}
.empty .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.empty h3{color:var(--ink);font-size:18px}
.empty p{max-width:420px;font-size:14px}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-lg);background:var(--oak-soft);color:var(--oak-ink);font-size:14px}
.banner .grow{flex:1;min-width:200px}
.banner b{color:var(--oak-ink)}

'use strict';
/* ================= Utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const N = (v) => { if (typeof v === 'number') return Number.isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/,/g, '').replace(/[^\d.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
const fmt = (n, d = 0) => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fq = (n) => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
const som = (n) => fmt(Math.round(Number(n) || 0)) + ' so‘m';
const short = (n) => { n = Math.round(Number(n) || 0); const a = Math.abs(n); if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + ' mlrd'; if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace(/\.0$/, '') + ' mln'; if (a >= 1e4) return Math.round(n / 1e3) + ' ming'; return fmt(n); };
const usd = (n) => '$' + fmt(n, Math.abs(Number(n) % 1) > 0.0001 ? 2 : 0);
const sum = (arr, f) => (arr || []).reduce((a, x) => a + (Number(f ? f(x) : x) || 0), 0);
const by = (f, dir = 1) => (a, b) => { const x = f(a), y = f(b); return x < y ? -dir : x > y ? dir : 0; };
const icon = (n, c = '') => `<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const initials = (s) => String(s || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase() || '?';
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = (s) => { const [y, m, d] = String(s || '').slice(0, 10).split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const MONTHS_C = MONTHS.map((m) => m[0].toUpperCase() + m.slice(1));
const WD = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const dmy = (s) => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}.${m}.${y}`; };
const dLong = (s) => { const d = parseD(s); return `${d.getDate()}-${MONTHS[d.getMonth()]}`; };
const monthName = (key) => { const [y, m] = key.split('-').map(Number); return `${MONTHS_C[m - 1]} ${y}`; };
const hhmm = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const PERIODS = [['bugun', 'Bugun'], ['hafta', 'Bu hafta'], ['oy', 'Bu oy'], ['otgan', 'O‘tgan oy'], ['yil', 'Bu yil'], ['hammasi', 'Hammasi']];
function periodRange(p) {
  const t = today(), d = parseD(t);
  switch (p) {
    case 'bugun': return [t, t];
    case 'hafta': { const mon = addDays(t, -((d.getDay() + 6) % 7)); return [mon, addDays(mon, 6)]; }
    case 'oy': return [t.slice(0, 7) + '-01', t.slice(0, 7) + '-31'];
    case 'otgan': { const x = new Date(d.getFullYear(), d.getMonth() - 1, 1); return [ymd(x), ymd(x).slice(0, 7) + '-31']; }
    case 'yil': return [t.slice(0, 4) + '-01-01', t.slice(0, 4) + '-12-31'];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
const inRange = (s, r) => !!s && s >= r[0] && s <= r[1];
const periodLabel = (p) => (PERIODS.find((x) => x[0] === p) || ['', ''])[1];

/* ================= Domain constants ================= */

const stageOf = (id) => STAGES.find((s) => s.id === id) || CANCELLED;

  { id: 'reklama', name: 'Reklama' }, { id: 'soliq', name: 'Soliq' }, { id: 'boshqa', name: 'Boshqa xarajat' },

const DIRECT_BUY_CATS = ['usluga', 'furnitura', 'transport'];
const withCur = (list, cur) => (cur && !list.includes(cur) ? list.concat([cur]) : list);
const catName = (id) => (IN_CATS.concat(OUT_CATS).find((c) => c.id === id) || { name: id === 'otkazma' ? 'O‘tkazma' : (id || '—') }).name;
const MAT_CATS = ['LDSP', 'MDF', 'HDF / DVP', 'Akril / fasad', 'Kromka', 'Furnitura', 'Mahkamlagich', 'Stoleshnitsa', 'Oyna / ko‘zgu', 'Bo‘yoq / lak', 'Boshqa'];
const UNITS = ['list', 'm²', 'p/m', 'dona', 'kompl', 'm', 'kg', 'litr'];
const ROLES = ['Usta', 'Yordamchi usta', 'O‘rnatuvchi', 'Haydovchi', 'Menejer', 'Boshqa'];
const SOURCES = ['Instagram', 'Telegram', 'Tanish orqali', 'Do‘kon', 'Boshqa'];
const MOVE_KINDS = { buyurtma: 'Buyurtmaga berildi', brak: 'Brak / yaroqsiz', inventar: 'Sanoq farqi', qaytarish: 'Omborga qaytarildi', boshqa: 'Boshqa' };
const WORK_KINDS = { ishbay: 'Ishbay', oylik: 'Oylik', bonus: 'Bonus', jarima: 'Jarima' };
const EXTRA_PRESETS = ['Kesish (usluga)', 'Kromka (usluga)', 'Rover (usluga)', 'Labo', 'O‘rnatish', 'Ishchi haqi', 'Boshqa'];

const OLD_PRODUCTS = ['Oshxona', 'Shkaf-kupe', 'Yotoqxona', 'Prixojka', 'Bolalar xonasi', 'Ofis mebeli', 'Boshqa'];
const productTypes = () => { const p = Store.settings.products; return !Array.isArray(p) || !p.length || p.join('|') === OLD_PRODUCTS.join('|') ? DEF_SETTINGS.products.slice() : p.slice(); };

/* ================= Production model: usluga-based workshop =================
   Cutting, edge banding and router work are bought as a service (usluga).
   Every order holds one or more items (buyum); each item gets its own list of works
   from STEP_LIB, filtered by the item's features (feats). Items assembled at the
   client's home (joy: 'uy') move «Yig‘ish» and everything after it to the «Mijoz uyida» phase. */
const PHASES = {
  hisob: { name: 'Hisob-kitob', hint: 'Raskroy rejasi, furnitura, HDF', cls: 's1' },
  olib: { name: 'Uslugada', hint: 'Kesish, kromka, rover → Labo bilan ishxonaga', cls: 's2' },

  uy: { name: 'Mijoz uyida', hint: 'Mijoz uyida yig‘iladigan ishlar', cls: 's4' },
};
const PHASE_IDS = ['hisob', 'olib', 'sex', 'uy'];
const FEATS = [
  ['rolik', 'Roliklar (tortma)'], ['mexanizm', 'Sushilka, kargo, mexanizm'], ['polka', 'Polkalar'], ['eshik', 'Eshiklar'], ['ruchka', 'Ruchkalar'],
  ['planka', 'Stol plankalari'], ['fartuk', 'Fartuk va stol usti'], ['truba', 'Truba'], ['veshilka', 'Veshilka'], ['qosh', 'Qosh'], ['hdf', 'HDF orqa devor'],
];
const featName = (id) => (FEATS.find((f) => f[0] === id) || [id, id])[1];
const STEP_LIB = [
  { id: 'raskroy', ph: 'hisob', name: 'Planirovka: raskroy, nechta detal ketishi', short: 'Raskroy rejasi' },
  { id: 'furnitura', ph: 'hisob', name: 'Furnitura hisoblash', short: 'Furnitura hisobi' },
  { id: 'hdf', ph: 'hisob', name: 'HDF o‘lchamini hisoblash', short: 'HDF o‘lchami', f: 'hdf' },
  { id: 'olib', ph: 'olib', name: 'Xomashyo va detallarni ishxonaga olib kelish', short: 'Detallar keldi' },
  { id: 'ajratish', ph: 'sex', name: 'Detallarni ajratib qo‘yish', short: 'Ajratish' },
  { id: 'peresatka', ph: 'sex', name: 'Peresatka', short: 'Peresatka' },
  { id: 'rolik', ph: 'sex', name: 'Roliklarni o‘rnatish', short: 'Roliklar', f: 'rolik' },
  { id: 'yigish', ph: 'sex', name: 'Yig‘ish', short: 'Yig‘ish', home: 1 },
  { id: 'planka', ph: 'sex', name: 'Stolga qotiriladigan plankalarni tekshirish: xato bo‘lsa tuzatish, tayyor bo‘lsa qotirish', short: 'Stol plankalari', f: 'planka', home: 1 },
  { id: 'mexanizm', ph: 'sex', name: 'Sushilka yoki kargo va mexanizmlarni o‘rnatish', short: 'Sushilka, kargo', f: 'mexanizm', home: 1 },
  { id: 'polka', ph: 'sex', name: 'Polkalarga derjatel urish, polkalarni tekshirish', short: 'Polkalar', f: 'polka', home: 1 },
  { id: 'truba', ph: 'sex', name: 'Trubani kesib o‘rnatish', short: 'Truba', f: 'truba', home: 1 },
  { id: 'veshilka', ph: 'sex', name: 'Veshilka o‘rnatish', short: 'Veshilka', f: 'veshilka', home: 1 },
  { id: 'eshik_tek', ph: 'sex', name: 'Eshiklarni tekshirish, petlya joyini teshish', short: 'Petlya teshish', f: 'eshik', home: 1 },
  { id: 'eshik', ph: 'sex', name: 'Eshiklarni o‘rnatish', short: 'Eshiklar', f: 'eshik', home: 1 },
  { id: 'ruchka', ph: 'sex', name: 'Ruchkalarni o‘rnatish', short: 'Ruchkalar', f: 'ruchka', home: 1 },
  { id: 'qosh', ph: 'sex', name: 'Qoshni kesib o‘rnatish', short: 'Qosh', f: 'qosh', home: 1 },
  { id: 'fartuk', ph: 'sex', name: 'Fartuk va stol ustini kesish, chetlariga kromka yopishtirish', short: 'Fartuk, stol usti', f: 'fartuk', home: 1 },
];
const TYPE_FEATS = [
  [/oshxona|kuxn|kuhn/i, ['rolik', 'mexanizm', 'polka', 'eshik', 'ruchka', 'planka', 'fartuk', 'hdf']],
  [/shkaf|garderob|kupe/i, ['polka', 'truba', 'eshik', 'ruchka', 'hdf']],
  [/prix|perex|dahliz|koridor/i, ['polka', 'veshilka', 'eshik', 'ruchka', 'hdf']],
  [/yotoq|spal/i, ['rolik', 'polka', 'truba', 'eshik', 'ruchka', 'hdf']],
  [/bolalar|ofis|stol|tumba|komod/i, ['rolik', 'polka', 'eshik', 'ruchka', 'hdf']],
];
const typeFeats = (t) => (TYPE_FEATS.find(([re]) => re.test(t || '')) || [0, ['polka', 'eshik', 'ruchka', 'hdf']])[1].slice();
const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'ish';
function itemSteps(it) {
  const f = new Set(it.feats || []), uy = it.joy === 'uy';
  const out = STEP_LIB.filter((s) => !s.f || f.has(s.f)).map((s) => ({ ...s, ph: s.home && uy ? 'uy' : s.ph }));
  const seen = new Set();
  for (const raw of it.extra || []) {
    const name = String(raw || '').trim(); if (!name) continue;
    let id = 'x:' + slug(name); while (seen.has(id)) id += '+'; seen.add(id);
    out.push({ id, ph: uy ? 'uy' : 'sex', name, short: name.length > 24 ? name.slice(0, 23) + '…' : name, custom: true });
  }
  return out;
}
/* v1 orders had one product and workshop steps named Raskroy/Kromka/Prisadka/Yig‘ish/Qadoqlash */
const LEGACY_MAP = { 'Raskroy': ['raskroy', 'furnitura', 'hdf', 'olib'], 'Kromka': ['ajratish'], 'Prisadka': ['peresatka', 'rolik'], 'Yig‘ish': ['yigish', 'planka', 'mexanizm', 'polka', 'truba', 'veshilka'] };
function itemsOf(o) {
  if (Array.isArray(o.items) && o.items.length) return o.items;
  const type = String(o.product || 'Boshqa').split(',')[0].trim() || 'Boshqa';
  const it = { id: 'i1', type, title: o.title || '', price: N(o.price), feats: typeFeats(type), joy: 'sex', extra: [], done: {} };
  const steps = itemSteps(it);
  if (o.stage === 'tayyor' || o.stage === 'ornatildi') { for (const s of steps) it.done[s.id] = { d: o.readyAt || o.doneAt || null, w: null }; }
  else if (o.prod) {
    for (const [old, p] of Object.entries(o.prod)) for (const sid of LEGACY_MAP[old] || []) if (steps.some((s) => s.id === sid)) it.done[sid] = { d: (p && p.d) || null, w: (p && p.w) || null };
    if (o.prod['Qadoqlash']) for (const s of steps) if (!it.done[s.id]) it.done[s.id] = { d: o.prod['Qadoqlash'].d || null, w: null };
  }
  return [it];
}
/* Hamkorlik jobs follow the order stages and item steps. The first version had stages
   kelishildi → jarayonda → tugadi and one free-text title with one fee: read those as one item. */
const JOB_OLD_STAGE = { jarayonda: 'ishlab', tugadi: 'ornatildi' };
function fixJob(j) {
  if (JOB_OLD_STAGE[j.stage]) j.stage = JOB_OLD_STAGE[j.stage];
  if (JOB_OLD_STAGE[j.prevStage]) j.prevStage = JOB_OLD_STAGE[j.prevStage];
  if (!Array.isArray(j.items) || !j.items.length) j.items = [{ id: 'i1', type: 'Boshqa', title: j.title || '', price: N(j.fee), feats: typeFeats('Boshqa'), joy: 'sex', extra: [], done: {} }];
  return j;
}
function itemInfo(o, it) {
  const steps = itemSteps(it), done = it.done || {}, all = o.stage === 'ornatildi';
  const isDone = (s) => all || !!done[s.id];
  const left = steps.filter((s) => !isDone(s));
  return { steps, left, cur: left[0] || null, n: steps.length - left.length, total: steps.length, phase: left.length ? left[0].ph : 'tayyor', isDone };
}
const itemLabel = (it) => `${it.type || 'Buyum'}${it.title ? ' · ' + it.title : ''}`;
const oWhat = (o) => itemsOf(o).map((it) => (it.type || 'Buyum') + (it.title ? ' ' + it.title : '')).join(' + ');
function oProgress(o) { let n = 0, t = 0; for (const it of itemsOf(o)) { const x = itemInfo(o, it); n += x.n; t += x.total; } return { n, t, pct: t ? Math.round((n / t) * 100) : 0 }; }

/* ================= Store (cloud db or this device) ================= */
const ENTS = ['clients', 'orders', 'materials', 'suppliers', 'workers', 'purchases', 'jobs', 'partners'];
const LOGS = ['tx', 'moves', 'work'];
const ALL = ENTS.concat(LOGS);
const SHAPES = {
  tx: ['date', 'type', 'account', 'amount', 'uzs', 'rate', 'category', 'orderId', 'clientId', 'supplierId', 'purchaseId', 'workerId', 'jobId', 'partnerId', 'reimb', 'toAccount', 'toAmount', 'note', 'demo', 'by', 'at'],
  moves: ['date', 'mid', 'qty', 'kind', 'orderId', 'note', 'demo', 'by', 'at'],
  work: ['date', 'workerId', 'amount', 'kind', 'orderId', 'jobId', 'step', 'note', 'demo', 'by', 'at'],
};
const Store = {
  mode: 'loading', canWrite: true, ready: false, db: null, user: null, me: null, dl: null, role: 'owner', myName: '',
  data: Object.fromEntries(ALL.map((k) => [k, []])),
  settings: { ...DEF_SETTINGS },
  loaded: new Set(), names: {},
};
const shapeLog = (name, r) => { const o = {}; for (const k of SHAPES[name]) o[k] = r[k] === undefined ? null : r[k]; return o; };
const cleanEnt = (r) => { const o = {}; for (const [k, v] of Object.entries(r)) { if (k === 'id' || k === '_b' || v === undefined) continue; o[k] = v; } return o; };
const queues = {};
function enqueue(path, fn) { const p = (queues[path] || Promise.resolve()).catch(() => {}).then(fn); queues[path] = p; return p; }

const Local = {
  key: 'sombek.business.v1',
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) { const o = JSON.parse(raw); for (const k of ALL) Store.data[k] = Array.isArray(o[k]) ? o[k] : []; Store.settings = { ...DEF_SETTINGS, ...(o.settings || {}) }; }
    } catch (e) { Store.localBroken = true; }
  },
  persist() { try { localStorage.setItem(this.key, JSON.stringify({ ...Store.data, settings: Store.settings })); } catch (e) { Store.localBroken = true; } },
  put(name, rec) { const arr = Store.data[name].slice(); const i = arr.findIndex((x) => x.id === rec.id); const c = { ...rec }; delete c._b; if (i >= 0) arr[i] = c; else arr.push(c); Store.data[name] = arr; },
  del(name, id) { Store.data[name] = Store.data[name].filter((x) => x.id !== id); },
};

/* Ikki rol: egasi (hammasi) va ishchi (faqat buyurtmalar va sex; narx, to'lov, kassa, ish haqi ko'rinmaydi).
   Ishchi faqat shu to'plamlarni o'qiydi; qolganlari bazada ham faqat egasiga ochiq. */
const W_ENTS = ['clients', 'orders', 'workers', 'jobs', 'partners'];
const W_VIEWS = ['sex', 'buyurtmalar'];
const isWorker = () => Store.role === 'worker';
function setRole(r) {
  Store.role = r;
  try { localStorage.setItem('avaldo_role', r); } catch (e) {}
  document.body.classList.toggle('wk', r === 'worker');
  document.body.classList.remove('boot');
  if (r === 'worker' && !W_VIEWS.includes(UI.view)) UI.view = 'sex';
  changed();
}
async function initStore() {
  if (window.AvaldoWeb) return window.AvaldoWeb.init();
  let db = null, user = null, dl = null;
  const C = window.claude;
  if (C && typeof C.use === 'function') {
    try { [db, user, dl] = await Promise.all([C.use('db'), C.use('user'), C.use('downloads')]); } catch (e) { db = null; }
  }
  Store.dl = dl || null;
  if (user && user.me) user.me().then((m) => { if (m && m.name) { Store.myName = m.name; changed(); } }).catch(() => {});
  if (db) {
    let own = false;
    try { own = !!(user && (await user.isOwner())); } catch (e) {}
    if (!own) { try { own = !!(await db.doc('archive/v2').get()).exists; } catch (e) {} }
    setRole(own ? 'owner' : 'worker');
    startCloud(db, user);
  } else { setRole('owner'); startLocal(); }
}
function startLocal() {
  Store.mode = 'local'; Local.load(); Store.ready = true; changed();
}
function onDbErr(e) {
  if (e && e.code === 'revoked') { Store.canWrite = false; toast('Ma’lumotlarga kirish to‘xtatildi', true); }
  changed();
}
function startCloud(db, user) {
  Store.mode = 'cloud'; Store.db = db; Store.user = user;
  if (user) {
    user.id().then((id) => { Store.me = id || null; }).catch(() => {});
    Promise.resolve(user.can ? user.can('data.write') : null).then((v) => { if (v === false) { Store.canWrite = false; changed(); } }).catch(() => {});
  }
  const need = ALL.length + 1;
  const mark = (k) => { Store.loaded.add(k); if (!Store.ready && Store.loaded.size >= need) Store.ready = true; changed(); };
  const ents = isWorker() ? W_ENTS : ENTS, logs = isWorker() ? [] : LOGS;
  for (const k of ALL) if (!ents.includes(k) && !logs.includes(k)) Store.loaded.add(k);
  for (const name of ents) {
    db.collection(name).onSnapshot((snap) => {
      Store.data[name] = snap.docs.filter((d) => d.exists).map((d) => ({ ...d.data(), id: d.id }));
      mark(name);
    }, onDbErr);
  }
  for (const name of logs) {
    db.collection(name).onSnapshot((snap) => {
      const out = [];
      for (const d of snap.docs) { const items = (d.data() || {}).items || {}; for (const k of Object.keys(items)) { const v = items[k]; if (v && typeof v === 'object') out.push({ ...v, id: k, _b: d.id }); } }
      Store.data[name] = out; mark(name);
    }, onDbErr);
  }
  db.doc('meta/settings').onSnapshot((s) => { Store.settings = { ...DEF_SETTINGS, ...(s.exists ? s.data() : {}) }; mark('settings'); }, onDbErr);
  setTimeout(() => { if (!Store.ready) { Store.ready = true; changed(); } }, 8000);
}
async function bucketUpdate(name, b, items) {
  const ref = Store.db.collection(name).doc(b);
  return enqueue(name + '/' + b, async () => {
    try { await ref.update({ items }); }
    catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'transform_error')) {
        const s = await ref.get();
        if (!s.exists) { await ref.set({ items }); return; }
      }
      throw e;
    }
  });
}
function stamp(rec) { if (!rec.id) rec.id = uid(); if (!rec.at) rec.at = new Date().toISOString(); if (!rec.by && Store.me) rec.by = Store.me; return rec; }
async function saveMany(name, recs) {
  if (!Store.canWrite) throw { code: 'read_only' };
  recs = recs.map((r) => stamp({ ...r }));
  if (Store.mode !== 'cloud') { for (const r of recs) Local.put(name, r); Local.persist(); changed(); return recs; }
  if (LOGS.includes(name)) {
    const groups = {}, removals = {};
    for (const r of recs) {
      const b = String(r.date || today()).slice(0, 7);
      if (r._b && r._b !== b) (removals[r._b] = removals[r._b] || {})[r.id] = null;
      (groups[b] = groups[b] || {})[r.id] = shapeLog(name, r);
    }
    for (const [b, items] of Object.entries(removals)) await bucketUpdate(name, b, items);
    for (const [b, items] of Object.entries(groups)) await bucketUpdate(name, b, items);
  } else {
    for (const r of recs) { const body = cleanEnt(r); await enqueue(name + '/' + r.id, () => Store.db.collection(name).doc(r.id).set(body)); }
  }
  return recs;
}
const save = async (name, rec) => (await saveMany(name, [rec]))[0];
async function removeMany(name, recs) {
  if (!Store.canWrite) throw { code: 'read_only' };
  if (Store.mode !== 'cloud') { for (const r of recs) Local.del(name, r.id); Local.persist(); changed(); return; }
  if (LOGS.includes(name)) {
    const groups = {};
    for (const r of recs) { const b = r._b || String(r.date || '').slice(0, 7); (groups[b] = groups[b] || {})[r.id] = null; }
    for (const [b, items] of Object.entries(groups)) await bucketUpdate(name, b, items);
  } else {
    for (const r of recs) await enqueue(name + '/' + r.id, () => Store.db.collection(name).doc(r.id).delete());
  }
}
const remove = (name, rec) => removeMany(name, [rec]);
async function saveSettings(patch) {
  if (!Store.canWrite) throw { code: 'read_only' };
  const next = { ...Store.settings, ...patch }; delete next.steps;
  if (Store.mode !== 'cloud') { Store.settings = next; Local.persist(); changed(); return; }
  await enqueue('meta/settings', () => Store.db.doc('meta/settings').set(next));
}
function errText(e) {
  const c = e && e.code;
  if (c === 'read_only' || c === 'invalid_argument') return 'Saqlab bo‘lmadi: sizda o‘zgartirish huquqi yo‘q yoki ma’lumot noto‘g‘ri.';
  if (c === 'quota_exceeded') return 'Saqlab bo‘lmadi: baza to‘lgan. Eski namunalarni o‘chirib ko‘ring.';
  if (c === 'resource_exhausted') return 'Juda tez saqlanmoqda. Bir necha soniyadan keyin qayta urinib ko‘ring.';
  return 'Saqlab bo‘lmadi. Internetni tekshirib, qayta urinib ko‘ring.';
}
async function guard(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r ?? true; }
  catch (e) {
    console.error(e); toast(errText(e), true);
    /* the platform did not say whether this viewer may write; a refused write settles it for this visit */
    if (e && e.code === 'invalid_argument' && isWorker() && Store.canWrite) { Store.canWrite = false; changed(); }
    return false;
  }
}

/* ================= Model (derived numbers) ================= */
let M = null;
function compute() {
  const D = Store.data;
  for (const j of D.jobs) fixJob(j);
  const idx = (arr) => new Map(arr.map((r) => [r.id, r]));
  const m = {
    today: today(),
    client: idx(D.clients), order: idx(D.orders), material: idx(D.materials), supplier: idx(D.suppliers), worker: idx(D.workers), purchase: idx(D.purchases),
    job: idx(D.jobs), partner: idx(D.partners), jobPaid: new Map(), jobSpent: new Map(), jobReimb: new Map(), jobWork: new Map(),
    paid: new Map(), acc: Object.fromEntries(ACCOUNTS.map((a) => [a.id, 0])), supPaid: new Map(), purPaid: new Map(), wPaid: new Map(),
    stock: new Map(), purTotal: new Map(), supBought: new Map(), wAcc: new Map(), orderWork: new Map(), issuedVal: new Map(), orderSpent: new Map(),
  };
  const add = (map, k, v) => { if (!k) return; map.set(k, (map.get(k) || 0) + v); };
  for (const t of D.tx) {
    const amt = N(t.amount);
    if (t.type === 'kirim') { m.acc[t.account] = (m.acc[t.account] || 0) + amt; add(m.paid, t.orderId, N(t.uzs)); add(m.jobPaid, t.jobId, N(t.uzs)); }
    else if (t.type === 'chiqim') {
      m.acc[t.account] = (m.acc[t.account] || 0) - amt;
      add(m.supPaid, t.supplierId, N(t.uzs)); add(m.purPaid, t.purchaseId, N(t.uzs)); add(m.wPaid, t.workerId, N(t.uzs));
      /* a job's extra expenses; the employer pays them back unless marked «o‘zimdan» (reimb: false) */
      if (t.jobId && t.category !== 'ish_haqi') { add(m.jobSpent, t.jobId, N(t.uzs)); if (t.reimb !== false) add(m.jobReimb, t.jobId, N(t.uzs)); }
      if (t.supplierId && !t.purchaseId && (DIRECT_BUY_CATS.includes(t.category) || t.orderId)) add(m.supBought, t.supplierId, N(t.uzs));
      if (t.orderId && t.category !== 'ish_haqi') add(m.orderSpent, t.orderId, N(t.uzs));
    }
    else if (t.type === 'otkazma') { m.acc[t.account] = (m.acc[t.account] || 0) - amt; m.acc[t.toAccount] = (m.acc[t.toAccount] || 0) + N(t.toAmount); }
  }
  for (const p of D.purchases) {
    let tot = 0;
    for (const l of p.lines || []) { add(m.stock, l.mid, N(l.qty)); tot += N(l.qty) * N(l.price); }
    m.purTotal.set(p.id, tot); add(m.supBought, p.supplierId, tot);
  }
  for (const mv of D.moves) {
    add(m.stock, mv.mid, N(mv.qty));
    if (mv.orderId && N(mv.qty) < 0) { const mat = m.material.get(mv.mid); add(m.issuedVal, mv.orderId, -N(mv.qty) * N(mat && mat.price)); }
  }
  for (const w of D.work) { add(m.wAcc, w.workerId, N(w.amount)); add(m.orderWork, w.orderId, N(w.amount)); add(m.jobWork, w.jobId, N(w.amount)); }
  M = m;
}
const oPaid = (o) => M.paid.get(o.id) || 0;
const oMat = (o) => sum(o.smeta, (l) => N(l.qty) * N(l.price));
const oExtra = (o) => sum(o.extras, (e) => N(e.amount));
const oCost = (o) => oMat(o) + oExtra(o);
/* actual spending on an order: linked expenses + worker pay + stock issued to it */
const oSpent = (o) => (M.orderSpent.get(o.id) || 0) + (M.orderWork.get(o.id) || 0) + (M.issuedVal.get(o.id) || 0);
const oEstimated = (o) => !(oSpent(o) > 0);
const oCostBasis = (o) => (oEstimated(o) ? oCost(o) : oSpent(o));
const oProfit = (o) => N(o.price) - oCostBasis(o);
const oOver = (o) => (N(o.price) > 0 ? Math.max(0, oPaid(o) - N(o.price)) : 0);
const oDebt = (o) => (o.stage === 'bekor' ? 0 : Math.max(0, N(o.price) - oPaid(o)));
const oActive = (o) => o.stage !== 'ornatildi' && o.stage !== 'bekor';
const oClient = (o) => M.client.get(o.clientId) || { name: 'Noma’lum mijoz' };
const oLabel = (o) => `№${o.no} · ${oClient(o).name}`;
/* an order or a Hamkorlik job: both carry items with the same steps and stages */
const isJobRec = (o) => !!(o && M.job && M.job.has(o.id));
const kAttr = (o) => (isJobRec(o) ? ' data-k="job"' : '');
const unitGet = (d) => (d.k === 'job' ? M.job.get(d.id) : M.order.get(d.id));
const unitCol = (o) => (isJobRec(o) ? 'jobs' : 'orders');

const layers = [];

}
function closeTop() {

}
function closeAll() { while (layers.length) closeTop(); }

/* Detail sheet: re-renders itself when data changes. build() returns {title, sub, body, foot} or null when the record is gone. */

}
function refreshLayers() {

/* Form sheet: onSubmit(form) returns true to close. */
function openForm({ title, sub, body, foot, wide, onSubmit, onMount, onInput }) {
  const wrap = document.createElement('div'); wrap.className = 'sheet-wrap';
  wrap.innerHTML = sheetHTML({ title, sub, body, foot: foot || `<button type="button" class="btn" data-act="closeTop">Bekor qilish</button><button type="submit" class="btn primary">${icon('check', 'sm')}Saqlash</button>`, wide, form: true });

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); if (busy) return;
    busy = true; const btn = $('[type=submit]', form); if (btn) btn.disabled = true;
    try { const ok = await onSubmit(form); if (ok) closeLayerOf(wrap); }
    finally { busy = false; if (btn) btn.disabled = false; }
  });
  if (onInput) form.addEventListener('input', () => onInput(form));
  mountLayer(wrap, { form: true });
  if (onMount) onMount(form);
  if (onInput) onInput(form);
  const first = $('input.inp:not([type=hidden]):not([type=date]):not([readonly]),textarea.inp', $('.sheet-body', wrap));
  if (first && window.innerWidth > 860) first.focus({ preventScroll: true });
  return form;
}
function closeLayerOf(el) { const i = layers.findIndex((l) => l.el === el || l.el.contains(el)); if (i < 0) return; while (layers.length > i) closeTop(); }
function openModal({ title, body, acts, onSubmit, onMount, onInput, menu = false, wide = false }) {
  const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
  wrap.innerHTML = `<div class="sheet-bg" data-act="closeTop"></div><form class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" novalidate autocomplete="off"><h3>${title}</h3>${body || ''}<div class="acts">${acts || `<button type="button" class="btn" data-act="closeTop">Bekor qilish</button><button type="submit" class="btn primary">Saqlash</button>`}</div></form>`;
  const form = $('form', wrap);

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); if (busy || !onSubmit) return;
    busy = true; const btn = $('[type=submit]', form); if (btn) btn.disabled = true;
    try { const ok = await onSubmit(form); if (ok) closeLayerOf(wrap); }

/* number formatting while typing */
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches && el.matches('input[data-num]')) {
    const dec = el.dataset.num === 'dec';
    const old = el.value, pos = el.selectionStart ?? old.length;
    const before = old.slice(0, pos).replace(dec ? /[^\d.]/g : /[^\d]/g, '').length;
    let raw = old.replace(dec ? /[^\d.]/g : /[^\d]/g, '');
    if (dec) { const i = raw.indexOf('.'); if (i >= 0) raw = raw.slice(0, i + 1) + raw.slice(i + 1).replace(/\./g, ''); }
    let [ip, fp] = raw.split('.');
    ip = (ip || '').replace(/^0+(?=\d)/, '');
    let out = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    if (fp !== undefined) out = (out || '0') + '.' + fp.slice(0, 3);
    if (out !== old) {
      el.value = out;
      let cnt = 0, p = 0; while (p < out.length && cnt < before) { if (/[\d.]/.test(out[p])) cnt++; p++; }
      try { el.setSelectionRange(p, p); } catch (er) {}
    }
  }
  if (el.matches && el.matches('.opt input[type=radio]')) {
    const g = el.closest('.opts'); $$('.opt', g).forEach((o) => o.classList.toggle('on', $('input', o).checked));
  }
}, true);

function prodItems() {
  const out = [];
  const take = (o, job) => { if (!['kelishildi', 'ishlab', 'tayyor'].includes(o.stage)) return; for (const it of itemsOf(o)) { const info = itemInfo(o, it); out.push({ o, it, info, phase: info.phase, job }); } };
  for (const o of Store.data.orders) take(o, false);
  for (const j of Store.data.jobs) take(j, true);
  return out;
}
Titles.sex = () => { const its = prodItems(); const w = its.filter((x) => x.phase !== 'tayyor').length; return ['Ishlab chiqarish', `${w} ta buyum ishda · ${its.length - w} ta tayyor`]; };
Views.sex = () => {
  if (!Store.ready) return skeleton();
  const all = prodItems().sort(by((x) => (x.o.deadline || '9999-99-99') + String(x.o.no).padStart(6, '0')));
  const cols = PHASE_IDS.map((ph) => ({ name: PHASES[ph].name, hint: PHASES[ph].hint, cls: PHASES[ph].cls, list: all.filter((x) => x.phase === ph) }))

  const lateN = new Set(all.filter((x) => x.o.deadline && x.o.deadline < M.today).map((x) => x.o.id)).size;
  const head = `<div class="sumrow">${cols.map((c) => `<div><div class="k">${c.name}</div><div class="v">${c.list.length}</div></div>`).join('')}<div><div class="k">Kechikayotgan ish</div><div class="v ${lateN ? 'bad-t' : ''}">${lateN}</div></div></div>`;
  if (!all.length) return roNote() + head + emptyBox('saw', 'Hozircha ishlab chiqarishda buyum yo‘q', 'Buyurtma «Qabul qilindi» bo‘lgach, uning har bir buyumi shu yerga tushadi: hisob-kitob → usluga va Labo → sex → mijoz uyi. Har bir ish bajarilganda bitta tugma bilan belgilaysiz.', '<button class="btn" data-act="go" data-v="buyurtmalar">Buyurtmalarga o‘tish</button>');
  const card = ({ o, it, info, job }) => {
    const pct = info.total ? Math.round((info.n / info.total) * 100) : 0, who = unitWho(o);
    let btn;
    if (info.cur) btn = `<button class="btn sm soft" data-act="stepDone" data-id="${o.id}"${kAttr(o)} data-item="${esc(it.id)}" data-w>${icon('check', 'sm')}${esc(info.cur.short)}</button>`;
    else if (o.stage === 'tayyor') btn = isWorker() ? '<span class="muted" style="font-size:12.5px">Tayyor — yetkazish va o‘rnatish</span>' : `<button class="btn sm good" data-act="${job ? 'jobNext' : 'stageNext'}" data-id="${o.id}" data-w>${icon('check', 'sm')}O‘rnatildi</button>`;
    else btn = `<span class="muted" style="font-size:12.5px">${job ? 'Ishning' : 'Buyurtmaning'} boshqa buyumlari kutilmoqda</span>`;
    return `<div class="ocard pcard" data-act="${job ? 'openJob' : 'openOrder'}" data-id="${o.id}" role="button" tabindex="0">
      <div class="top"><span class="no">${unitNo(o)}</span><span class="pill st ${info.cur ? PHASES[info.cur.ph].cls : 's5'}" style="height:22px">${esc(it.type)}</span><span style="margin-left:auto">${deadlineChip(o)}</span></div>
      <div class="nm">${esc(who || it.title || it.type)}</div>
      ${(it.title && who) || job ? `<div class="pr">${job ? '<span class="tag" style="margin:0 6px 0 0">Hamkorlik</span>' : ''}${it.title && who ? esc(it.title) : ''}</div>` : ''}

function barChart(months) {
  const W = 640, H = 230, L = 56, R = 10, T = 14, B = 34;
  const max = Math.max(1, ...months.map((m) => Math.max(m.inc, m.exp)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map((k) => k * step).find((v) => v >= max);
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  const gw = (W - L - R) / months.length, bw = Math.min(26, gw / 3);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = (nice / 4) * i; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`; }
  months.forEach((m, i) => {
    const cx = L + gw * i + gw / 2;
    g += `<rect x="${cx - bw - 2}" y="${y(m.inc)}" width="${bw}" height="${Math.max(0, H - B - y(m.inc))}" rx="4" fill="var(--accent)"><title>${m.label}: kirim ${fmt(m.inc)} so‘m</title></rect>`;
    g += `<rect x="${cx + 2}" y="${y(m.exp)}" width="${bw}" height="${Math.max(0, H - B - y(m.exp))}" rx="4" fill="var(--oak)"><title>${m.label}: chiqim ${fmt(m.exp)} so‘m</title></rect>`;
    g += `<text x="${cx}" y="${H - 12}" text-anchor="middle">${m.short}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Oylar bo‘yicha kirim va chiqim">${g}</svg>`;
}
const hbars = (rows) => { const max = Math.max(1, ...rows.map((r) => r[1])); return `<div class="stack" style="gap:10px">${rows.map(([n, v]) => `<div class="hbar"><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="tr"><i style="width:${Math.max(2, (v / max) * 100)}%"></i></span><span class="vv">${fmt(v)}</span></div>`).join('')}</div>`; };

/* order stage follows the work: first ticked step → in production; workshop done → ready */
function syncStage(rec) {
  if (!['kelishildi', 'ishlab', 'tayyor'].includes(rec.stage)) return rec;
  const its = itemsOf(rec);
  const anyDone = its.some((it) => Object.keys(it.done || {}).length > 0);
  const wsLeft = its.some((it) => itemSteps(it).some((s) => s.ph !== 'uy' && !(it.done || {})[s.id]));
  let next = rec.stage;
  if (its.length && !wsLeft) next = 'tayyor';
  else if (rec.stage === 'tayyor') next = 'ishlab';
  else if (rec.stage === 'kelishildi' && anyDone) next = 'ishlab';
  if (next !== rec.stage) {
    addHist(rec, next === 'tayyor' ? 'Sexdagi ishlar tugadi — tayyor' : rec.stage === 'tayyor' ? 'Ishlab chiqarishga qaytdi' : 'Ishlab chiqarish boshlandi');
    if (next === 'ishlab' && !rec.startedAt) rec.startedAt = M.today;
    if (next === 'tayyor') rec.readyAt = M.today;
    rec.stage = next;
  }
  return rec;
}

async function setStage(o, stage, patch = {}, note = '') {
  const rec = { ...o, ...patch, stage, history: (o.history || []).slice() };
  addHist(rec, note || `Bosqich: ${stageOf(stage).name}`);
  return save('orders', rec);
}
function shortageList(o) {
  const need = {};
  for (const l of o.smeta || []) if (l.mid) need[l.mid] = (need[l.mid] || 0) + N(l.qty);
  return Object.entries(need).filter(([mid, q]) => stockOf(mid) < q).map(([mid, q]) => { const m = M.material.get(mid); return `${m ? m.name : 'Material'}: kerak ${fq(q)}, omborda ${fq(stockOf(mid))} ${m ? m.unit || '' : ''}`; });
}
async function issueMaterials(o) {
  const mv = (o.smeta || []).filter((l) => l.mid && N(l.qty) > 0).map((l) => ({ date: M.today, mid: l.mid, qty: -N(l.qty), kind: 'buyurtma', orderId: o.id, note: `№${o.no} uchun` }));

  return mv.length;
}

A.addLine = (d, el) => { const f = el.closest('form'); $(d.to || '#lines', f).insertAdjacentHTML('beforeend', LineTpl.mat()); const last = $$('[data-line] .combo input[type=text]', $(d.to || '#lines', f)).pop(); if (last) last.focus(); };
A.addEx = (d, el) => { const f = el.closest('form'); $('#exlines', f).insertAdjacentHTML('beforeend', LineTpl.ex({ name: d.name === 'Boshqa' ? '' : d.name })); const inp = $$('[data-ex]', f).pop(); $(d.name && d.name !== 'Boshqa' ? 'input[name=examount]' : 'input[name=exname]', inp).focus(); f.dispatchEvent(new Event('input')); };

function wireLines(form, { priceFromMaterial = true } = {}) {

    const line = e.target.closest('[data-line]'); if (!line) return;

function transferForm(t) {
  const isNew = !t; const base = t || { account: 'naqd', toAccount: 'karta', date: M.today };

      return guard(() => save('tx', rec), 'O‘tkazma yozildi');
    },

/* raqamni so‘z bilan: 26,200,000 → yigirma olti million ikki yuz ming */
function sonSoz(n) {
  n = Math.round(Math.abs(Number(n) || 0)); if (!n) return 'nol';
  const B = ['', 'bir', 'ikki', 'uch', 'to‘rt', 'besh', 'olti', 'yetti', 'sakkiz', 'to‘qqiz'];
  const O = ['', 'o‘n', 'yigirma', 'o‘ttiz', 'qirq', 'ellik', 'oltmish', 'yetmish', 'sakson', 'to‘qson'];
  const S = ['', 'ming', 'million', 'milliard', 'trillion'];
  const tri = (x) => [Math.floor(x / 100) ? B[Math.floor(x / 100)] + ' yuz' : '', O[Math.floor((x % 100) / 10)], B[x % 10]].filter(Boolean).join(' ');
  const out = []; let i = 0;
  while (n > 0) { const x = n % 1000; if (x) out.unshift(tri(x) + (S[i] ? ' ' + S[i] : '')); n = Math.floor(n / 1000); i++; }
  return out.join(' ');
}

  });

/* ================= Hamkorlik: ish beruvchilardan olingan ishlar =================
   O‘z buyurtmasi bo‘lmagan paytda boshqa korxona, do‘kon yoki ustadan olingan ish. Ish o‘z buyurtmasi kabi
   yuradi: buyumlar, har bir buyumning ishlar ro‘yxati (hisob-kitob → usluga → sex → joyida) va bir xil
   bosqichlar (O‘lchov → Qabul qilindi → Ishlab chiqarishda → Tayyor → O‘rnatildi). Pul tomoni boshqa:
   faqat usta puli (har bir buyum uchun kelishilgan haq) va qo‘shimcha xarajatlar. Qo‘shimcha xarajatni egasi
   o‘z hisobidan qiladi, ish beruvchi esa uni qaytaradi: ish beruvchi qarzi = usta puli + qaytariladigan
   xarajatlar − olingan pul; sof foyda = usta puli − o‘zidan ketgan xarajatlar (qaytarilmaydigan va ishchilar haqi).
   Olingan pul — kassada «Hamkorlik: usta puli» kirimi, xarajat — kassada chiqim; ikkalasi ham ishga bog‘lanadi.
   Ishchilar ishni Ishlab chiqarish doskasida pulsiz ko‘radi va bajarilgan ishlarni belgilaydi. */
const JOB_LONG = {
  olchov: 'O‘lchov olinadi, usta puli kelishiladi',
  kelishildi: 'Ish qabul qilindi — boshlanishi kutilmoqda',
  ishlab: 'Hisob-kitob, usluga va sexdagi ishlar',
  tayyor: 'Sexdagi ishlar tugadi — yetkazish va o‘rnatish',
  ornatildi: 'O‘rnatildi, ish beruvchiga topshirildi',
};
const jLong = (st) => JOB_LONG[st] || stageOf(st).long;
const JOB_EXP_CATS = [['transport', 'Yo‘l, transport, Labo'], ['ovqat', 'Ovqat'], ['furnitura', 'Furnitura, mayda material'], ['usluga', 'Usluga: kesish, kromka'], ['uskuna', 'Asbob-uskuna'], ['ish_haqi', 'Ishchi haqi (hozir berildi)'], ['boshqa', 'Boshqa']];
const jNo = (j) => `H-${j.no}`;
const jPartner = (j) => M.partner.get(j.partnerId) || { name: 'Noma’lum ish beruvchi' };
const jPaid = (j) => M.jobPaid.get(j.id) || 0;
const jReimb = (j) => M.jobReimb.get(j.id) || 0;
/* everything spent on a job: kassa expenses (worker pay counted once, from the pay log) + worker pay */
const jSpent = (j) => (M.jobSpent.get(j.id) || 0) + (M.jobWork.get(j.id) || 0);
/* what stays on the owner: expenses the employer does not pay back + worker pay */
const jOwn = (j) => jSpent(j) - jReimb(j);
/* what the employer owes in total: usta puli + the extra expenses he pays back */
const jDue = (j) => N(j.fee) + jReimb(j);
const jDebt = (j) => (j.stage === 'bekor' ? 0 : Math.max(0, jDue(j) - jPaid(j)));
const jOver = (j) => (jDue(j) > 0 ? Math.max(0, jPaid(j) - jDue(j)) : 0);
const jProfit = (j) => N(j.fee) - jOwn(j);
const jActive = (j) => j.stage !== 'ornatildi' && j.stage !== 'bekor';
const jProd = (j) => ['kelishildi', 'ishlab', 'tayyor'].includes(j.stage);
const partnerJobs = (pid) => Store.data.jobs.filter((j) => j.partnerId === pid);
const jWorks = (id) => Store.data.work.filter((w) => w.jobId === id).sort(by((w) => w.date || '', -1));
ComboSrc.partners = () => Store.data.partners.slice().sort(by((p) => (p.name || '').toLowerCase())).map((p) => ({ id: p.id, label: p.name, sub: p.phone || '', s: `${p.name} ${p.phone || ''}` }));
const jobSelect = (name, cur) => selectInp(name, Store.data.jobs.filter((j) => j.stage !== 'bekor' || j.id === cur).sort(by((j) => -N(j.no))).map((j) => [j.id, `${jNo(j)} · ${jPartner(j).name} · ${oWhat(j)}`]), cur, '— bog‘lanmagan —');

const jTrack = (j, btns = '') => `<div class="track">${STAGES.map((x, i) => `<div class="st ${i < stageIdx(j.stage) ? 'done' : ''} ${i === stageIdx(j.stage) ? 'cur' : ''}"><i></i><span>${x.name}</span></div>`).join('')}</div>${btns ? `<div class="split"><span class="muted">${jLong(j.stage)}</span><div class="gap">${btns}</div></div>` : `<div class="muted">${jLong(j.stage)}</div>`}`;

  const costs = `<div class="block"><h4>${icon('out', 'sm')}Qo‘shimcha xarajatlar<span class="act"><button class="btn sm soft" data-act="jobExpense" data-id="${id}" data-w>${icon('plus', 'sm')}Xarajat</button></span></h4>
